<p class="eyebrow">iOS 版 frp 用戶端</p>
<h1>連線至自己的服務。</h1>
<p class="lead">FerryPorts 是 iOS 上的 frp 用戶端。使用自己的伺服器設定管理連線、查看執行狀態和記錄，並在授權後為連線記錄標註大致位置。</p>
<p>你需要自行準備有權存取的 frps 伺服器及設定。背景執行受 iOS、網路狀態和權限限制。</p>
